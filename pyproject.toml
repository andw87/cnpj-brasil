[project]
name = "cnpjbench"
version = "1.0.0"
description = "Measured comparison of free Brazilian CNPJ lookup APIs (BrasilAPI, Minha Receita, ReceitaWS, CNPJá, CNPJ.ws, OpenCNPJ)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pymongo>=4.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
viz = ["matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
