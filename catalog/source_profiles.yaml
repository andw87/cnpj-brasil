# Facts about each source taken from provider documentation, source code and observation (2026-11-17).
# Measured numbers are NOT written here: scripts/95_build_source_docs.py reads them from results/summary.json.
# Every claim carries a link; "not documented" means no statement was found.

S01:
  display_name: BrasilAPI
  operator: {en: "Community open-source project (MIT), hosted on Vercel", pt: "Projeto comunitário de código aberto (MIT), hospedado na Vercel"}
  website: https://brasilapi.com.br
  docs_url: https://brasilapi.com.br/docs#tag/CNPJ
  repo_url: https://github.com/BrasilAPI/BrasilAPI
  auth: {en: none, pt: nenhuma}
  limit_documented: {en: "not documented; the Vercel firewall answers 403/429 to empty or generic User-Agents ([#826](https://github.com/BrasilAPI/BrasilAPI/issues/826), [#835](https://github.com/BrasilAPI/BrasilAPI/issues/835))", pt: "não documentado; o firewall da Vercel responde 403/429 para User-Agent vazio ou genérico ([#826](https://github.com/BrasilAPI/BrasilAPI/issues/826), [#835](https://github.com/BrasilAPI/BrasilAPI/issues/835))"}
  limit_observed: {en: "no 429 up to ~190 rpm; a second unpaced burst within one minute was answered 100% HTTP 429 (no Retry-After)", pt: "nenhum 429 até ~190 req/min; uma segunda rajada sem ritmo no mesmo minuto recebeu 100% HTTP 429 (sem Retry-After)"}
  upstream: {en: "**proxy of Minha Receita (S02)**: the CNPJ route calls `https://minhareceita.org/{cnpj}` with a 5 s timeout ([services/cnpj.js](https://github.com/BrasilAPI/BrasilAPI/blob/main/services/cnpj.js))", pt: "**proxy da Minha Receita (S02)**: a rota de CNPJ chama `https://minhareceita.org/{cnpj}` com timeout de 5 s ([services/cnpj.js](https://github.com/BrasilAPI/BrasilAPI/blob/main/services/cnpj.js))"}
  cadence: {en: "same as Minha Receita, plus Vercel edge cache (404 answers are cached too)", pt: "a mesma da Minha Receita, mais o cache de borda da Vercel (respostas 404 também ficam em cache)"}
  terms: {en: "code MIT; no usage terms for the API found", pt: "código MIT; não foram encontrados termos de uso da API"}
  python_check: "data = r.json() if r.status_code == 200 else None   # 404 = not found (may be a cached 404), 400 = invalid CNPJ"
  js_check: "const data = r.status === 200 ? await r.json() : null; // 404 may be a cached 404"
  connect_notes: {en: "Send a descriptive `User-Agent`. A 404 can be a stale cached answer: requesting the punctuated form (`/api/cnpj/v1/12.345.678%2F0001-95`) bypasses the cache entry of the bare form.", pt: "Envie um `User-Agent` descritivo. Um 404 pode ser resposta antiga em cache: pedir a forma pontuada (`/api/cnpj/v1/12.345.678%2F0001-95`) evita a entrada de cache da forma sem pontuação."}
  rate_limit_response: {en: "HTTP 429, no rate-limit headers", pt: "HTTP 429, sem cabeçalhos de limite"}
  issues:
    en:
      - "**Stale cached 404s.** 26 of the 297 existing CNPJs (8.8%) were answered 404; BrasilAPI forwards the bare CNPJ to Minha Receita, whose CDN served old cached 404s. All 26 were returned (200) when requested in punctuated form, which bypasses the cache. The skew towards S.A. companies matches the hypothesis that frequently queried CNPJs were cached during upstream outages; the cause was not determined."
      - "Share capital above 16,777,216 is rounded (float32): 26 of 39 such values differ from the other sources, e.g. 4,443,409,696.10 → 4,443,410,000."
      - "No e-mail address; street and number missing in 14% of records; Simples/MEI flags filled in 57% of records."
      - "Inherits Minha Receita outages: 503 errors reported in October 2026 ([#916](https://github.com/BrasilAPI/BrasilAPI/issues/916), [#920](https://github.com/BrasilAPI/BrasilAPI/issues/920))."
    pt:
      - "**404 antigos em cache.** 26 dos 297 CNPJs existentes (8,8%) receberam 404; a BrasilAPI repassa o CNPJ sem pontuação à Minha Receita, cuja CDN serviu 404 antigos em cache. Os 26 foram retornados (200) quando pedidos na forma pontuada, que escapa do cache. A concentração em sociedades anônimas é compatível com a hipótese de CNPJs muito consultados terem entrado no cache durante falhas da origem; a causa não foi determinada."
      - "Capital social acima de 16.777.216 é arredondado (float32): 26 de 39 valores nessa faixa diferem das outras fontes, ex.: 4.443.409.696,10 → 4.443.410.000."
      - "Não retorna e-mail; logradouro e número ausentes em 14% dos registros; Simples/MEI preenchidos em 57% dos registros."
      - "Herda as quedas da Minha Receita: erros 503 relatados em outubro de 2026 ([#916](https://github.com/BrasilAPI/BrasilAPI/issues/916), [#920](https://github.com/BrasilAPI/BrasilAPI/issues/920))."
  verdict:
    en: "Proxy of Minha Receita (S02): same data and same freshness (2026-11 release online on 2026-11-16, two days after publication), no key. Measured caveats: 404 served from a stale cache for 8.8% of existing CNPJs (retry in punctuated form), share capital above R$ 16,777,216 rounded, HTTP 429 to a second unpaced burst."
    pt: "Proxy da Minha Receita (S02): mesmos dados e mesmo frescor (base de 2026-11 no ar em 16/11/2026, dois dias após a publicação), sem chave. Ressalvas medidas: 404 servido de cache antigo para 8,8% dos CNPJs existentes (repita na forma pontuada), capital social acima de R$ 16.777.216 arredondado, HTTP 429 para uma segunda rajada sem ritmo."

S02:
  display_name: Minha Receita
  operator: {en: "Open-source project maintained by an individual developer, funded by donations; code moved to Codeberg", pt: "Projeto de código aberto mantido por um desenvolvedor, financiado por doações; código migrado para o Codeberg"}
  website: https://minhareceita.org
  docs_url: https://docs.minhareceita.org
  repo_url: https://codeberg.org/cuducos/minha-receita
  auth: {en: none, pt: nenhuma}
  limit_documented: {en: "no rate limit by design ([PR #99](https://codeberg.org/cuducos/minha-receita/pulls/99)); self-hosting is recommended for heavy use", pt: "sem limite por decisão de projeto ([PR #99](https://codeberg.org/cuducos/minha-receita/pulls/99)); para uso intenso recomenda-se hospedar a própria instância"}
  limit_observed: {en: "no 429 at ~6,300 rpm (4 concurrent requests, cached CNPJs)", pt: "nenhum 429 a ~6.300 req/min (4 simultâneas, CNPJs em cache)"}
  upstream: {en: "Receita Federal monthly open-data release, downloaded from the official share ([download/webdav.go](https://codeberg.org/cuducos/minha-receita/src/branch/main/download/webdav.go)); `/updated` answered `2026-11`", pt: "base mensal de dados abertos da Receita Federal, baixada do compartilhamento oficial ([download/webdav.go](https://codeberg.org/cuducos/minha-receita/src/branch/main/download/webdav.go)); `/updated` respondeu `2026-11`"}
  cadence: {en: "monthly, manually, 'normally a few days after the release' ([FAQ](https://docs.minhareceita.org/faq/)); 2026-11 release (extracted 2026-11-14) was live on 2026-11-16", pt: "mensal, manual, 'normalmente poucos dias após a publicação' ([FAQ](https://docs.minhareceita.org/faq/)); a base de 2026-11 (extraída em 14/11/2026) estava no ar em 16/11/2026"}
  terms: {en: "code MIT; no terms of use for the public instance found", pt: "código MIT; não foram encontrados termos de uso da instância pública"}
  python_check: "data = r.json() if r.status_code == 200 else None   # 404 = not found (may be a cached 404), 400 = invalid CNPJ"
  js_check: "const data = r.status === 200 ? await r.json() : null; // 404 may be a cached 404"
  connect_notes: {en: "Cloudflare caches answers for up to 5 days (`max-age=432000`), including 404. Requesting the punctuated form (`/12.345.678%2F0001-95`) bypasses a stale entry. `/updated` returns the release month. For volume, run your own instance (Docker, PostgreSQL).", pt: "A Cloudflare guarda respostas por até 5 dias (`max-age=432000`), inclusive 404. Pedir a forma pontuada (`/12.345.678%2F0001-95`) evita uma entrada antiga. `/updated` informa o mês da base. Para volume, rode sua própria instância (Docker, PostgreSQL)."}
  issues:
    en:
      - "**Stale cached 404s.** 22 of the 297 existing CNPJs (7.4%) were answered 404 with `cf-cache-status: HIT`; all 22 were returned (200) in punctuated form. Known mechanism: 404s minted during reloads or outages stay cached ([#1](https://codeberg.org/cuducos/minha-receita/issues/1), [#98](https://codeberg.org/cuducos/minha-receita/issues/98))."
      - "Share capital above 16,777,216 is rounded (float32)."
      - "No e-mail address; street and number missing in 14% of records; Simples/MEI flags filled in 59% of records."
      - "Outages: ~99% HTTP 503 on 2026-10-08/09 ([#98](https://codeberg.org/cuducos/minha-receita/issues/98))."
    pt:
      - "**404 antigos em cache.** 22 dos 297 CNPJs existentes (7,4%) receberam 404 com `cf-cache-status: HIT`; os 22 foram retornados (200) na forma pontuada. Mecanismo conhecido: 404 gerados durante recargas ou quedas permanecem em cache ([#1](https://codeberg.org/cuducos/minha-receita/issues/1), [#98](https://codeberg.org/cuducos/minha-receita/issues/98))."
      - "Capital social acima de 16.777.216 é arredondado (float32)."
      - "Não retorna e-mail; logradouro e número ausentes em 14% dos registros; Simples/MEI preenchidos em 59% dos registros."
      - "Quedas: ~99% HTTP 503 em 08–09/10/2026 ([#98](https://codeberg.org/cuducos/minha-receita/issues/98))."
  verdict:
    en: "Newest data among the seven sources measured (companies opened up to 2026-11-14 present on 2026-11-16). No key; no rate limit documented or observed (0% HTTP 429 at up to 6,310 requests/min); open source and self-hostable. Measured caveats: 404 served from a stale cache for 7.4% of existing CNPJs, share capital above R$ 16,777,216 rounded, no e-mail."
    pt: "Dados mais recentes entre as sete fontes medidas (empresas abertas até 14/11/2026 presentes em 16/11/2026). Sem chave; nenhum limite documentado ou observado (0% de HTTP 429 a até 6.310 requisições/min); código aberto e auto-hospedável. Ressalvas medidas: 404 servido de cache antigo para 7,4% dos CNPJs existentes, capital social acima de R$ 16.777.216 arredondado, sem e-mail."

S03:
  display_name: ReceitaWS
  operator: {en: "Commercial company (ReceitaWS)", pt: "Empresa comercial (ReceitaWS)"}
  website: https://receitaws.com.br
  docs_url: https://developers.receitaws.com.br
  repo_url: null
  auth: {en: "none (free tier)", pt: "nenhuma (plano gratuito)"}
  limit_documented: {en: "3 requests per minute (free tier)", pt: "3 requisições por minuto (plano gratuito)"}
  limit_observed: {en: "`X-RateLimit-Limit: 3`; 16% of requests answered 429 even when paced at 3 rpm", pt: "`X-RateLimit-Limit: 3`; 16% das requisições receberam 429 mesmo no ritmo de 3 req/min"}
  upstream: {en: "lookups of the Receita Federal website, stored in its own cache; the free API serves the cache only, a CNPJ not cached answers HTTP 504 ([spec](https://developers.receitaws.com.br/receitaws.yaml))", pt: "consultas ao site da Receita Federal guardadas em cache próprio; a API gratuita serve só o cache, um CNPJ fora do cache responde HTTP 504 ([spec](https://developers.receitaws.com.br/receitaws.yaml))"}
  cadence: {en: "per record (`ultima_atualizacao`)", pt: "por registro (`ultima_atualizacao`)"}
  terms: {en: "personal benefit only, no commercial use ([terms](https://receitaws.com.br/terms.pdf))", pt: "apenas para benefício próprio, sem comercialização ([termos](https://receitaws.com.br/terms.pdf))"}
  python_check: "data = r.json(); ok = r.status_code == 200 and data.get('status') != 'ERROR'   # errors come as HTTP 200"
  js_check: "const data = await r.json(); const ok = r.status === 200 && data.status !== 'ERROR'; // errors come as HTTP 200"
  connect_notes: {en: "Errors are returned with HTTP 200 and `{\"status\": \"ERROR\", \"message\": ...}`. Dates are `dd/mm/yyyy`; legal nature is `\"206-2 - Sociedade Empresária Limitada\"`.", pt: "Erros vêm com HTTP 200 e `{\"status\": \"ERROR\", \"message\": ...}`. Datas em `dd/mm/aaaa`; natureza jurídica como `\"206-2 - Sociedade Empresária Limitada\"`."}
  rate_limit_response: {en: "HTTP 429 with `X-RateLimit-Limit`, `X-RateLimit-Remaining`", pt: "HTTP 429 com `X-RateLimit-Limit`, `X-RateLimit-Remaining`"}
  issues:
    en:
      - "Main CNAE missing in 27% and partner list in 17% of the records where other sources have them."
      - "No IBGE municipality code."
      - "Phone field is free text and includes the fax number."
      - "Effective throughput 2.5 CNPJs per minute."
      - "New companies nobody has queried before are answered `{\"status\": \"ERROR\", \"message\": \"not in cache\"}` (HTTP 404) on the free tier."
    pt:
      - "CNAE principal ausente em 27% e quadro societário em 17% dos registros em que outras fontes os têm."
      - "Não retorna código IBGE do município."
      - "Telefone em texto livre, incluindo o fax."
      - "Vazão efetiva de 2,5 CNPJs por minuto."
      - "Empresas novas que ninguém consultou antes recebem `{\"status\": \"ERROR\", \"message\": \"not in cache\"}` (HTTP 404) no plano gratuito."
  verdict:
    en: "Coverage 99.0% of existing companies, but 2.5 CNPJs/min effective at the documented 3 requests/min, 16.0% HTTP 429 at that pace, the free tier serves only its own cache, and the terms forbid commercial use. Suited to occasional lookups."
    pt: "Cobertura de 99,0% das empresas existentes, mas 2,5 CNPJs/min efetivos no limite documentado de 3 requisições/min, 16,0% de HTTP 429 nesse ritmo, o plano gratuito serve só o próprio cache e os termos proíbem uso comercial. Adequada a consultas ocasionais."

S04:
  display_name: CNPJá Open
  operator: {en: "Commercial company (CNPJá), free public tier", pt: "Empresa comercial (CNPJá), plano público gratuito"}
  website: https://cnpja.com
  docs_url: https://cnpja.com/api/open
  repo_url: null
  auth: {en: none, pt: nenhuma}
  limit_documented: {en: "5 requests per minute per IP ([cnpja.com/api/open](https://cnpja.com/api/open))", pt: "5 requisições por minuto por IP ([cnpja.com/api/open](https://cnpja.com/api/open))"}
  limit_observed: {en: "11% of requests answered 429 even when paced at 5 rpm", pt: "11% das requisições receberam 429 mesmo no ritmo de 5 req/min"}
  upstream: {en: "own aggregation of Receita Federal and Simples Nacional data; states that it is not the original source ([terms](https://cnpja.com/subscription/tos))", pt: "agregação própria de dados da Receita Federal e do Simples Nacional; declara não ser a fonte original ([termos](https://cnpja.com/subscription/tos))"}
  cadence: {en: "'update guarantee of 45 days or less for active establishments' ([cnpja.com/api/open](https://cnpja.com/api/open)); per record (`updated`)", pt: "'garantia de atualização de 45 dias ou menos para estabelecimentos ativos' ([cnpja.com/api/open](https://cnpja.com/api/open)); por registro (`updated`)"}
  terms: {en: "see [terms](https://cnpja.com/subscription/tos); restrictions for the free tier not confirmed", pt: "ver [termos](https://cnpja.com/subscription/tos); restrições do plano gratuito não confirmadas"}
  python_check: "data = r.json() if r.status_code == 200 else None   # 404 = not found, 429 = wait 60 s"
  js_check: "const data = r.status === 200 ? await r.json() : null;"
  connect_notes: {en: "Nested English-keyed JSON (`company.name`, `address.municipality`, `mainActivity.id`). Company size comes as an acronym (`ME`, `EPP`, `DEMAIS`).", pt: "JSON aninhado com chaves em inglês (`company.name`, `address.municipality`, `mainActivity.id`). Porte vem como sigla (`ME`, `EPP`, `DEMAIS`)."}
  rate_limit_response: {en: "HTTP 429; recently founded companies: HTTP 402 `recently founded offices only available in commercial api`", pt: "HTTP 429; empresas recém-abertas: HTTP 402 `recently founded offices only available in commercial api`"}
  issues:
    en:
      - "Effective throughput 4.5 CNPJs per minute; 11% of requests rate-limited at the documented pace."
      - "Phones missing in 5% of the records where other sources have them."
      - "Recently founded companies: HTTP 402 `recently founded offices only available in commercial api` for 13 of the 36 companies opened in 2026-11-01..14 that it was asked about."
    pt:
      - "Vazão efetiva de 4,5 CNPJs por minuto; 11% das requisições limitadas no ritmo documentado."
      - "Telefones ausentes em 5% dos registros em que outras fontes os têm."
      - "Empresas recém-abertas: HTTP 402 `recently founded offices only available in commercial api` para 13 das 36 empresas abertas em 01–14/11/2026 consultadas."
  verdict:
    en: "Highest relative completeness measured (99.8%; IBGE code, e-mail and Simples/MEI included). Limited to 5 requests/min per IP (4.5 CNPJs/min effective, 10.7% HTTP 429 at that pace); 13 of 36 companies opened on 2026-11-01..14 were answered HTTP 402 on the free tier. Suited to enriching individual records of established companies."
    pt: "Maior completude relativa medida (99,8%; inclui código IBGE, e-mail e Simples/MEI). Limitada a 5 requisições/min por IP (4,5 CNPJs/min efetivos, 10,7% de HTTP 429 nesse ritmo); 13 de 36 empresas abertas em 01–14/11/2026 receberam HTTP 402 no plano gratuito. Adequada para completar registros individuais de empresas já estabelecidas."

S05:
  display_name: CNPJ.ws (public API)
  operator: {en: "Commercial company (CNPJ.ws), free public tier", pt: "Empresa comercial (CNPJ.ws), plano público gratuito"}
  website: https://www.cnpj.ws
  docs_url: https://docs.cnpj.ws/referencia-de-api/api-publica
  repo_url: null
  auth: {en: none, pt: nenhuma}
  limit_documented: {en: "3 requests per minute per IP; more than 360 HTTP 429 in an hour blocks the IP for 1 hour ([limits](https://docs.cnpj.ws/referencia-de-api/api-publica/limitacoes))", pt: "3 requisições por minuto por IP; mais de 360 HTTP 429 em uma hora bloqueia o IP por 1 hora ([limitações](https://docs.cnpj.ws/referencia-de-api/api-publica/limitacoes))"}
  limit_observed: {en: "`x-ratelimit-limit: 3`, `x-ratelimit-reset`; 11% of requests answered 429 at 3 rpm; from ~02:00 UTC on 2026-11-17 mostly HTTP 500/504 and timeouts", pt: "`x-ratelimit-limit: 3`, `x-ratelimit-reset`; 11% das requisições receberam 429 a 3 req/min; a partir de ~02:00 UTC de 17/11/2026, majoritariamente HTTP 500/504 e timeouts"}
  upstream: {en: "Receita Federal, SEFAZ/SINTEGRA, Suframa, fetched periodically ([docs](https://docs.cnpj.ws))", pt: "Receita Federal, SEFAZ/SINTEGRA, Suframa, coletados periodicamente ([docs](https://docs.cnpj.ws))"}
  cadence: {en: "maximum lag 45 days ([terms](https://www.cnpj.ws/pt-BR/termos-de-uso)); per record (`atualizado_em`)", pt: "defasagem máxima de 45 dias ([termos](https://www.cnpj.ws/pt-BR/termos-de-uso)); por registro (`atualizado_em`)"}
  terms: {en: "personal benefit only, no commercial use ([terms](https://www.cnpj.ws/pt-BR/termos-de-uso))", pt: "apenas para benefício próprio, sem comercialização ([termos](https://www.cnpj.ws/pt-BR/termos-de-uso))"}
  python_check: "data = r.json() if r.status_code == 200 else None   # 429: wait for x-ratelimit-reset seconds"
  js_check: "const data = r.status === 200 ? await r.json() : null;"
  connect_notes: {en: "Establishment data is nested under `estabelecimento`; state registrations (`inscricoes_estaduais`) are included, which no other free source returns.", pt: "Dados do estabelecimento ficam em `estabelecimento`; inclui inscrições estaduais (`inscricoes_estaduais`), que nenhuma outra fonte gratuita retorna."}
  rate_limit_response: {en: "HTTP 429 with `x-ratelimit-limit`, `x-ratelimit-remaining`, `x-ratelimit-reset`", pt: "HTTP 429 com `x-ratelimit-limit`, `x-ratelimit-remaining`, `x-ratelimit-reset`"}
  issues:
    en:
      - "Degraded during the test: 12.4% of CNPJs ended in HTTP 500/504 or timeout; latency p95 16 s."
      - "Partner list agrees with the other sources in only 79% of records."
      - "Some records omit fields at the company's request."
      - "Freshness: the newest opening date in its own records is 2026-10-27; it also returned one company opened on 2026-11-06 (date given by the other sources) whose record had no opening date."
    pt:
      - "Degradou durante o teste: 12,4% dos CNPJs terminaram em HTTP 500/504 ou timeout; latência p95 de 16 s."
      - "Quadro societário concorda com as outras fontes em apenas 79% dos registros."
      - "Alguns registros omitem campos a pedido da empresa."
      - "Frescor: a data de abertura mais recente nos próprios registros é 27/10/2026; também retornou uma empresa aberta em 06/11/2026 (data informada pelas outras fontes) cujo registro não trazia data de abertura."
  verdict:
    en: "Returns state registrations (`inscricoes_estaduais`), which no other source in this study returns. 1.4 CNPJs/min effective at 3 requests/min; degraded during the test (12.4% of CNPJs ended in HTTP 500/504 or timeout); the terms forbid commercial use."
    pt: "Retorna inscrições estaduais (`inscricoes_estaduais`), que nenhuma outra fonte deste estudo retorna. 1,4 CNPJ/min efetivo a 3 requisições/min; degradada durante o teste (12,4% dos CNPJs terminaram em HTTP 500/504 ou timeout); os termos proíbem uso comercial."

S06:
  display_name: OpenCNPJ.org
  operator: {en: "Non-profit open-source project (MIT)", pt: "Projeto de código aberto sem fins lucrativos (MIT)"}
  website: https://opencnpj.org
  docs_url: https://opencnpj.org
  repo_url: https://github.com/Hitmasu/OpenCNPJ
  auth: {en: none, pt: nenhuma}
  limit_documented: {en: "no fixed quota; bursts above 100 requests/second accepted; sustained abuse → 429 ([opencnpj.org](https://opencnpj.org))", pt: "sem cota fixa; picos acima de 100 requisições/segundo aceitos; abuso contínuo → 429 ([opencnpj.org](https://opencnpj.org))"}
  limit_observed: {en: "no 429 up to ~5,200 rpm (4 concurrent requests)", pt: "nenhum 429 até ~5.200 req/min (4 simultâneas)"}
  upstream: {en: "Receita Federal monthly release → ETL → static shards on Cloudflare R2; full dataset also downloadable; `/info` reports `source_snapshot_month: 2026-10`", pt: "base mensal da Receita Federal → ETL → fragmentos estáticos no Cloudflare R2; base completa também disponível para download; `/info` informa `source_snapshot_month: 2026-10`"}
  cadence: {en: "monthly; the 2026-10 release (published 2026-10-13) was loaded on 2026-11-01", pt: "mensal; a base de 2026-10 (publicada em 13/10/2026) foi carregada em 01/11/2026"}
  terms: {en: "code MIT; free use including commercial (site FAQ)", pt: "código MIT; uso gratuito, inclusive comercial (FAQ do site)"}
  python_check: "data = r.json() if r.status_code == 200 else None   # 404 = not found OR invalid CNPJ (no validation)"
  js_check: "const data = r.status === 200 ? await r.json() : null;"
  connect_notes: {en: "Validate the check digits yourself: the API answers 404 for an invalid CNPJ. `GET https://api.opencnpj.org/info` returns the release month and record count.", pt: "Valide os dígitos verificadores antes: a API responde 404 para CNPJ inválido. `GET https://api.opencnpj.org/info` informa o mês da base e o número de registros."}
  issues:
    en:
      - "About one month behind the official release: newest company returned opened on 2026-10-08; none of the companies opened after 2026-10-15 were returned."
      - "No IBGE municipality code; Simples/MEI flags filled in 57% of records."
      - "No input validation (wrong check digit → 404)."
    pt:
      - "Cerca de um mês atrás da base oficial: a empresa mais recente retornada abriu em 08/10/2026; nenhuma das empresas abertas depois de 15/10/2026 foi retornada."
      - "Não retorna código IBGE; Simples/MEI preenchidos em 57% dos registros."
      - "Não valida a entrada (dígito errado → 404)."
  verdict:
